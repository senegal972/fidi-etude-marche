<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A1826" />
  <title>Créer un compte — Optimmo Dom</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/shared.css" />

  <style>
    body { background: var(--ink); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 48px 16px; }
    .logo { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: 0.14em; color: var(--white); margin-bottom: 36px; }
    .logo em { font-style: normal; color: var(--accent); }
    .box { width: 100%; max-width: 480px; padding: 36px 32px; background: var(--navy); border: 1px solid rgba(238,243,247,0.10); border-radius: 4px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
    h1 { font-family: var(--serif); font-size: 40px; font-weight: 400; line-height: 1.1; color: var(--white); margin: 8px 0 10px; }
    .lead { color: #A9B8C6; font-size: 14px; margin-bottom: 26px; }
    form { display: flex; flex-direction: column; gap: 16px; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A9B8C6; }
    input {
      min-height: 46px; padding: 0 14px; background: var(--ink); color: var(--white);
      border: 1px solid rgba(238,243,247,0.3); border-radius: 2px; font-family: var(--sans); font-size: 16px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    #code-field[hidden] { display: none; }
    .btn {
      min-height: 50px; margin-top: 6px; background: var(--accent); color: var(--ink); border: 0; border-radius: 2px; cursor: pointer;
      font-family: var(--sans); font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .msg { display: none; padding: 12px 14px; border-radius: 2px; font-size: 14px; border: 1px solid #E08A6A; color: #E08A6A; }
    .msg.show { display: block; }
    .msg.ok { border-color: #5CC9A8; color: #5CC9A8; }
    .alt { margin-top: 22px; font-size: 14px; color: #A9B8C6; text-align: center; }
    .alt a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <a href="../index.html" class="logo">OPTIMMO <em>DOM</em></a>

  <main class="box">
    <div class="eyebrow">Mon espace</div>
    <h1>Créer un compte</h1>
    <p class="lead">Le compte est gratuit. Les applications s'ouvrent ensuite une à une : sur attribution pour les membres du réseau, sur souscription pour les autres.</p>

    <form id="form" novalidate>
      <div class="msg" id="msg" role="alert" aria-live="polite"></div>
      <div class="row">
        <label>Prénom <input type="text" id="prenom" autocomplete="given-name" required /></label>
        <label>Nom <input type="text" id="nom" autocomplete="family-name" required /></label>
      </div>
      <label>Adresse e-mail <input type="email" id="email" autocomplete="email" required /></label>
      <label>Mot de passe (8 caractères minimum) <input type="password" id="password" autocomplete="new-password" minlength="8" required /></label>
      <label id="code-field" hidden>Code d'installation administrateur <input type="password" id="code" autocomplete="off" /></label>
      <button type="submit" class="btn" id="btn">Créer mon compte</button>
    </form>

    <p class="alt">Déjà un compte ? <a href="./index.html">Se connecter</a></p>
  </main>

  <script>
    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    function show(text, ok) { msg.textContent = text; msg.className = 'msg show' + (ok ? ' ok' : ''); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        prenom: document.getElementById('prenom').value.trim(),
        nom: document.getElementById('nom').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };
      const code = document.getElementById('code').value;
      if (code) body.code_admin = code;
      if (!body.prenom || !body.nom || !body.email) { show('Merci de renseigner votre prénom, votre nom et votre e-mail.'); return; }
      if (body.password.length < 8) { show('Le mot de passe doit contenir au moins 8 caractères.'); return; }

      btn.disabled = true;
      try {
        const res = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.success) {
          show('Compte créé. Redirection vers la connexion…', true);
          setTimeout(() => window.location.assign('./index.html'), 1200);
          return;
        }
        if (data.code_requis) document.getElementById('code-field').hidden = false;
        show(data.error || 'Création du compte impossible — réessayez.');
      } catch (err) {
        show('Connexion au serveur impossible — vérifiez votre réseau et réessayez.');
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
