<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A1826" />
  <title>Mon espace — Optimmo Dom</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/shared.css" />

  <style>
    html, body { min-height: 100%; }
    body { background: var(--ink); }

    #gate {
      position: fixed; inset: 0; z-index: 2000; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity 400ms, visibility 400ms;
    }
    #gate.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .gate-spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 2px solid rgba(43,185,218,0.2); border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gate-text { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--slate); }

    .bar { border-bottom: 1px solid rgba(238,243,247,0.10); }
    .bar-in {
      max-width: 1280px; margin: 0 auto; padding: 18px 5%;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
    }
    .logo { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: 0.14em; color: var(--white); }
    .logo em { font-style: normal; color: var(--accent); }
    .bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
    .who { text-align: right; line-height: 1.35; }
    .who-name { font-weight: 600; color: var(--white); font-size: 14px; }
    .who-role { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
    .btn-ghost {
      min-height: 44px; padding: 0 18px; background: transparent; cursor: pointer;
      border: 1px solid rgba(238,243,247,0.35); border-radius: 2px; color: var(--text);
      font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      transition: border-color 250ms, color 250ms;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--white); }

    main { max-width: 1280px; margin: 0 auto; padding: 56px 5% 80px; display: flex; flex-direction: column; gap: 40px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
    h1 { font-family: var(--serif); font-size: clamp(36px, 4.4vw, 56px); font-weight: 400; line-height: 1.08; color: var(--white); margin: 10px 0; }
    .lead { color: #A9B8C6; max-width: 720px; }

    .banner { display: none; padding: 14px 18px; border-radius: 4px; font-size: 14px; border: 1px solid rgba(238,243,247,0.2); }
    .banner.show { display: block; }
    .banner.error { border-color: #E08A6A; color: #E08A6A; }
    .banner.success { border-color: #5CC9A8; color: #5CC9A8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; }
    .card {
      display: flex; flex-direction: column; gap: 12px; padding: 26px;
      background: var(--navy); border: 1px solid rgba(238,243,247,0.10); border-radius: 4px;
    }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .famille { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .badge {
      padding: 4px 10px; border-radius: 2px; white-space: nowrap; border: 1px solid #A9B8C6; color: #A9B8C6;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .badge.on { border-color: #5CC9A8; color: #5CC9A8; }
    .card h2 { font-family: var(--serif); font-size: 27px; font-weight: 500; color: var(--white); }
    .card p { font-size: 14px; color: #A9B8C6; }
    .card-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid rgba(238,243,247,0.10); display: flex; justify-content: flex-end; }
    .cta {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 2px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;
    }
    .cta.open { background: var(--accent); color: var(--ink); }
    .cta.open:hover { background: var(--accent-lt); }
    .cta.ask { border: 1px solid rgba(238,243,247,0.5); color: var(--white); }
    .cta.ask:hover { border-color: var(--accent); }
    .cta.soon { color: #A9B8C6; border: 1px dashed rgba(238,243,247,0.25); }

    .admin { display: none; flex-direction: column; gap: 18px; padding: 26px; background: var(--ink-mid); border: 1px solid var(--gold); border-radius: 4px; }
    .admin.show { display: flex; }
    .admin h2 { font-family: var(--serif); font-size: 28px; font-weight: 500; color: var(--white); }
    .admin-label { font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 760px; }
    th { text-align: left; padding: 10px 12px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A9B8C6; border-bottom: 1px solid rgba(238,243,247,0.15); }
    td { padding: 12px; vertical-align: top; border-bottom: 1px solid rgba(238,243,247,0.08); color: var(--text); }
    td small { display: block; color: #A9B8C6; }
    select {
      min-height: 40px; padding: 0 10px; background: var(--ink); color: var(--text);
      border: 1px solid rgba(238,243,247,0.3); border-radius: 2px; font-family: var(--sans); font-size: 14px;
    }
    .apps-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .apps-checks label, .actif-label { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; cursor: pointer; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    .btn-save {
      min-height: 40px; padding: 0 16px; background: var(--accent); color: var(--ink); border: 0; border-radius: 2px; cursor: pointer;
      font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .btn-save:disabled { opacity: 0.5; cursor: default; }
    .empty { color: #A9B8C6; font-size: 14px; }
  </style>
</head>
<body>
  <div id="gate">
    <div class="gate-spinner"></div>
    <div class="gate-text">Chargement de votre espace…</div>
  </div>

  <header class="bar">
    <div class="bar-in">
      <a href="../index.html" class="logo">OPTIMMO <em>DOM</em></a>
      <div class="bar-right">
        <div class="who">
          <div class="who-name" id="who-name">—</div>
          <div class="who-role" id="who-role">—</div>
        </div>
        <button class="btn-ghost" id="btn-logout" type="button">Déconnexion</button>
      </div>
    </div>
  </header>

  <main>
    <div>
      <div class="eyebrow" id="eyebrow">Mon espace</div>
      <h1>Mes applications</h1>
      <p class="lead" id="lead"></p>
    </div>

    <div class="banner" id="banner" role="status" aria-live="polite"></div>

    <section class="admin" id="admin" aria-labelledby="admin-title">
      <div>
        <div class="admin-label">Administration</div>
        <h2 id="admin-title">Membres, clients et attributions</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Compte</th><th>Profil</th><th>Applications attribuées</th><th>État</th><th></th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
      <p class="empty" id="users-empty" hidden>Aucun compte pour le moment.</p>
    </section>

    <section class="grid" id="apps" aria-label="Applications"></section>
  </main>

  <script>
    const API = '/api';
    const LOGIN_URL = './index.html';
    const ROLE_LABEL = { admin: 'Administrateur', reseau: 'Membre du réseau', client: 'Client' };
    const TEXTES = {
      admin:  { eyebrow: 'Espace administrateur', lead: 'Vous accédez à toutes les applications et pilotez les accès de chaque membre et client.' },
      reseau: { eyebrow: 'Espace réseau', lead: 'Les applications attribuées par Optimmo Dom s’ouvrent d’un clic. Chaque application garde sa propre facturation.' },
      client: { eyebrow: 'Espace client', lead: 'Vos applications s’ouvrent d’un clic. Pour les autres, faites une demande : nous revenons vers vous avec l’offre correspondante.' },
    };

    function token() { return localStorage.getItem('optimmo_token'); }
    function authHeaders() { const t = token(); return t ? { 'Authorization': 'Bearer ' + t } : {}; }
    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function banner(type, msg) { const b = document.getElementById('banner'); b.textContent = msg; b.className = 'banner show ' + type; }

    async function loadProfile() {
      let res;
      try { res = await fetch(API + '/auth/me', { credentials: 'include', headers: authHeaders() }); }
      catch (e) { document.querySelector('.gate-text').textContent = 'Connexion indisponible — réessayez'; return; }
      if (res.status === 401) { localStorage.removeItem('optimmo_token'); window.location.replace(LOGIN_URL + '?expire=1'); return; }
      if (!res.ok) { document.querySelector('.gate-text').textContent = 'Erreur de chargement'; return; }
      const data = await res.json();
      render(data);
      document.getElementById('gate').classList.add('hidden');
      if (data.user && data.user.role === 'admin') loadUsers();
    }

    function render(data) {
      const u = data.user || {};
      const role = ROLE_LABEL[u.role] ? u.role : 'client';
      document.getElementById('who-name').textContent = ((u.prenom || '') + ' ' + (u.nom || '')).trim() || u.email || '—';
      document.getElementById('who-role').textContent = ROLE_LABEL[role];
      document.getElementById('eyebrow').textContent = TEXTES[role].eyebrow;
      document.getElementById('lead').textContent = TEXTES[role].lead;

      const grid = document.getElementById('apps');
      grid.textContent = '';
      (data.applications || []).forEach((app) => {
        const card = el('article', 'card');
        const top = el('div', 'card-top');
        top.appendChild(el('span', 'famille', app.famille));
        const statut = app.acces ? (role === 'admin' ? 'Accès total' : 'Accès actif') : (role === 'reseau' ? 'Non attribuée' : 'Non souscrit');
        top.appendChild(el('span', 'badge' + (app.acces ? ' on' : ''), statut));
        card.appendChild(top);
        card.appendChild(el('h2', null, app.nom));
        card.appendChild(el('p', null, app.texte));
        const foot = el('div', 'card-foot');
        let cta;
        if (app.acces && app.url) {
          cta = el('a', 'cta open', 'Ouvrir →');
          cta.href = app.url; cta.target = '_blank'; cta.rel = 'noopener';
        } else if (app.acces) {
          cta = el('span', 'cta soon', 'Bientôt disponible');
        } else {
          cta = el('a', 'cta ask', role === 'reseau' ? 'Demander l’accès' : 'Souscrire');
          cta.href = '../contact.html?type=application&app=' + encodeURIComponent(app.nom);
        }
        foot.appendChild(cta);
        card.appendChild(foot);
        grid.appendChild(card);
      });
    }

    /* ---------- Administration ---------- */
    async function loadUsers() {
      document.getElementById('admin').classList.add('show');
      let res;
      try { res = await fetch(API + '/admin/users', { credentials: 'include', headers: authHeaders() }); }
      catch (e) { banner('error', 'Liste des comptes indisponible.'); return; }
      if (!res.ok) { banner('error', 'Liste des comptes indisponible.'); return; }
      const data = await res.json();
      const body = document.getElementById('users-body');
      body.textContent = '';
      document.getElementById('users-empty').hidden = (data.users || []).length > 0;
      (data.users || []).forEach((u) => body.appendChild(userRow(u, data.applications || [])));
    }

    function userRow(u, applications) {
      const tr = el('tr');
      const tdWho = el('td');
      tdWho.appendChild(document.createTextNode(((u.prenom || '') + ' ' + (u.nom || '')).trim() || '—'));
      tdWho.appendChild(el('small', null, u.email));
      tr.appendChild(tdWho);

      const tdRole = el('td');
      const sel = el('select');
      sel.setAttribute('aria-label', 'Profil de ' + u.email);
      Object.keys(ROLE_LABEL).forEach((r) => { const o = el('option', null, ROLE_LABEL[r]); o.value = r; if (r === u.role) o.selected = true; sel.appendChild(o); });
      tdRole.appendChild(sel);
      tr.appendChild(tdRole);

      const tdApps = el('td');
      const checks = el('div', 'apps-checks');
      const boxes = applications.map((a) => {
        const lab = el('label');
        const cb = el('input'); cb.type = 'checkbox'; cb.value = a.id; cb.checked = (u.apps || []).includes(a.id);
        lab.appendChild(cb); lab.appendChild(document.createTextNode(a.nom));
        checks.appendChild(lab);
        return cb;
      });
      tdApps.appendChild(checks);
      tr.appendChild(tdApps);

      const tdActif = el('td');
      const labA = el('label', 'actif-label');
      const cbA = el('input'); cbA.type = 'checkbox'; cbA.checked = u.actif !== false;
      labA.appendChild(cbA); labA.appendChild(document.createTextNode('Actif'));
      tdActif.appendChild(labA);
      tr.appendChild(tdActif);

      const tdSave = el('td');
      const btn = el('button', 'btn-save', 'Enregistrer'); btn.type = 'button';
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const res = await fetch(API + '/admin/users', {
            method: 'POST', credentials: 'include',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ email: u.email, role: sel.value, apps: boxes.filter((b) => b.checked).map((b) => b.value), actif: cbA.checked }),
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) banner('success', 'Compte ' + u.email + ' mis à jour.');
          else banner('error', data.error || 'Enregistrement impossible.');
        } catch (e) { banner('error', 'Enregistrement impossible — vérifiez votre connexion.'); }
        btn.disabled = false;
      });
      tdSave.appendChild(btn);
      tr.appendChild(tdSave);
      return tr;
    }

    document.getElementById('btn-logout').addEventListener('click', async () => {
      try { await fetch(API + '/auth/logout', { method: 'POST', credentials: 'include', headers: authHeaders() }); }
      catch (e) { /* ignore */ }
      localStorage.removeItem('optimmo_token');
      window.location.replace(LOGIN_URL);
    });

    loadProfile();
  </script>
</body>
</html>
