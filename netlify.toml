[build]
  publish   = "."
  functions = "netlify/functions"
  command   = "npm install --omit=dev --no-audit --no-fund"

# ── Timeout étendu pour les fonctions DVF (fetch sections + Etalab) ───────────
[functions."transactions"]
  timeout = 26

[functions."analyse"]
  timeout = 26

[functions."batiment"]
  timeout = 20

[functions."pappers"]
  timeout = 12

[functions."permis"]
  timeout = 15

[functions."services"]
  timeout = 15

[functions."loyers"]
  timeout = 12

[functions."revenus"]
  timeout = 12

[functions."avis-de-valeur"]
  timeout = 12

# ── Redirections API → Netlify Functions ──────────────────────────────────────
[[redirects]]
  from   = "/api/analyse"
  to     = "/.netlify/functions/analyse"
  status = 200

[[redirects]]
  from   = "/api/transactions"
  to     = "/.netlify/functions/transactions"
  status = 200

[[redirects]]
  from   = "/api/autocomplete"
  to     = "/.netlify/functions/autocomplete"
  status = 200

[[redirects]]
  from   = "/api/entreprise"
  to     = "/.netlify/functions/entreprise"
  status = 200

[[redirects]]
  from   = "/api/batiment"
  to     = "/.netlify/functions/batiment"
  status = 200

[[redirects]]
  from   = "/api/pappers"
  to     = "/.netlify/functions/pappers"
  status = 200

[[redirects]]
  from   = "/api/permis"
  to     = "/.netlify/functions/permis"
  status = 200

[[redirects]]
  from   = "/api/services"
  to     = "/.netlify/functions/services"
  status = 200

[[redirects]]
  from   = "/api/loyers"
  to     = "/.netlify/functions/loyers"
  status = 200

[[redirects]]
  from   = "/api/revenus"
  to     = "/.netlify/functions/revenus"
  status = 200

[[redirects]]
  from   = "/api/avis-de-valeur"
  to     = "/.netlify/functions/avis-de-valeur"
  status = 200

# ── Auth & Paiements Espace Partenaires Optimmo Dom ───────────────────────────
[[redirects]]
  from   = "/api/auth/register"
  to     = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from   = "/api/auth/login"
  to     = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from   = "/api/auth/me"
  to     = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from   = "/api/auth/logout"
  to     = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from   = "/api/paypal/subscription"
  to     = "/.netlify/functions/paypal-subscription"
  status = 200

[[redirects]]
  from   = "/api/paypal/order"
  to     = "/.netlify/functions/paypal-order"
  status = 200

[[redirects]]
  from   = "/api/paypal/webhook"
  to     = "/.netlify/functions/paypal-webhook"
  status = 200

# ── Application Étude de Marché (URL propre, séparée du site) ─────────────────
# L'app DVF/DPE/analyse vit à la racine (/index.html).
# On lui donne une URL propre /etude-marche pour l'espace partenaires.
[[redirects]]
  from   = "/etude-marche"
  to     = "/index.html"
  status = 200

# ── Racine du domaine → site vitrine Optimmo Dom ──────────────────────────────
[[redirects]]
  from   = "/"
  to     = "/optimodum-website/"
  status = 302
  force  = true

# Raccourcis propres vers les pages publiques (fidiconseil.com/services, etc.)
[[redirects]]
  from   = "/services"
  to     = "/optimodum-website/services.html"
  status = 302
[[redirects]]
  from   = "/catalogue"
  to     = "/optimodum-website/catalogue.html"
  status = 302
[[redirects]]
  from   = "/realisations"
  to     = "/optimodum-website/realisations.html"
  status = 302
[[redirects]]
  from   = "/contact"
  to     = "/optimodum-website/contact.html"
  status = 302
[[redirects]]
  from   = "/espace-partenaires"
  to     = "/optimodum-website/espace-partenaires/"
  status = 302

# Pages légales
[[redirects]]
  from   = "/mentions-legales"
  to     = "/optimodum-website/mentions-legales.html"
  status = 302
[[redirects]]
  from   = "/rgpd"
  to     = "/optimodum-website/rgpd.html"
  status = 302

# ── Fallback : toute URL non trouvée → site Optimmo Dom (pas l'app) ──────────
[[redirects]]
  from   = "/*"
  to     = "/optimodum-website/index.html"
  status = 200
